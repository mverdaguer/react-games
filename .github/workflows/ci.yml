name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload dist
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 1

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set the production database id
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          if [ -z "$CLOUDFLARE_D1_DATABASE_ID" ]; then
            echo "Set the CLOUDFLARE_D1_DATABASE_ID secret to the arcade database id."
            exit 1
          fi
          placeholder="00000000-0000-0000-0000-000000000000"
          if [ "$CLOUDFLARE_D1_DATABASE_ID" = "$placeholder" ]; then
            echo "CLOUDFLARE_D1_DATABASE_ID is still the placeholder."
            exit 1
          fi
          # Match the whole secret. grep treats ^ and $ as line ends, so a UUID
          # followed by more text would pass and then be written into the config.
          if [[ ! "$CLOUDFLARE_D1_DATABASE_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            echo "CLOUDFLARE_D1_DATABASE_ID is not a database id."
            exit 1
          fi
          if ! grep -q "$placeholder" wrangler.jsonc; then
            echo "wrangler.jsonc is missing the database_id placeholder."
            exit 1
          fi
          sed -i "s/$placeholder/$CLOUDFLARE_D1_DATABASE_ID/g" wrangler.jsonc

      - name: Download dist
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.164.0"
          preCommands: wrangler d1 migrations apply arcade --remote
          # npm is already on the runner. Left unset, the action sees
          # pnpm-lock.yaml and tries pnpm, which this job does not install.
          packageManager: npm
